  window_manager: ^0.5.2
  cupertino_icons: ^1.0.9
  solar_icon_pack: ^0.3.0
  package_info_plus: ^10.2.1
  fluentui_system_icons: ^1.1.273

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: false
