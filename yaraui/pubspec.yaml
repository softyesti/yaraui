repository: https://github.com/softyesti/yaraui
issue_tracker: https://github.com/softyesti/yaraui/issues

platforms:
  ios:
  macos:
  linux:
  android:
  windows:

resolution: workspace

version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ^3.44.9

dependencies:
  flutter:
    sdk: flutter

  get_it: ^9.2.1
  webview_all: ^1.2.1
